name: "EnvGene Execution"

run-name: "EnvGene Execution - ${{ github.event.inputs.ENV_NAMES }}"

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      ENV_NAMES:
        required: true
        type: string
        description: ""
      CLUSTER_NAME:
        required: false
        default: ""
        type: string
        description: ""
      ENVIRONMENT_NAME:
        required: false
        default: ""
        type: string
        description: ""
      PIPELINE_TYPE:
        required: false
        default: ""
        type: string
        description: ""
      OPERATION_TYPE:
        required: false
        default: ""
        type: string
        description: ""
      BGD_OPERATION:
        required: false
        default: ""
        type: string
        description: ""
      BG_NS_TARGET:
        required: false
        default: ""
        type: string
        description: ""
      NAMESPACE_NAMES:
        required: false
        default: ""
        type: string
        description: ""
      DEPLOYMENT_TICKET_ID:
        required: false
        default: ""
        type: string
        description: ""
      ENV_TEMPLATE_VERSION:
        required: false
        default: ""
        type: string
        description: ""
      ENV_INVENTORY_CONTENT:
        required: false
        default: ""
        type: string
        description: ""
      CUSTOM_PARAMS:
        required: false
        default: ""
        type: string
        description: ""
      DEPLOYMENT_SESSION_ID:
        required: false
        default: ""
        type: string
        description: ""
      APPLICATION_VERSIONS:
        required: false
        default: ""
        type: string
        description: ""
      ENV_BUILDER:
        required: false
        default: true
        type: boolean
        description: ""
      GENERATE_EFFECTIVE_SET:
        required: false
        default: false
        type: boolean
        description: ""
      GET_PASSPORT:
        required: false
        default: false
        type: boolean
        description: ""
      CMDB_IMPORT:
        required: false
        default: false
        type: boolean
        description: ""
      GH_ADDITIONAL_PARAMS:
        required: false
        default: ""
        type: string
        description: ""

concurrency:
  group: "envgene-${{ github.ref }}-${{ inputs.ENV_NAMES }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
    #CONFIGURATION
    SECRET_POSTFIX: ${{ vars.SECRET_POSTFIX || 'secret_postfix' }}
    DOCKER_CLOUD_REGISTRY_PROVIDER: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER || '' }}

    # GitLab-compatible paths for scripts inside the EnvGene image
    CI_PROJECT_DIR: ${{ github.workspace }}
    INSTANCES_DIR: ${{ github.workspace }}/environments
    CI_COMMIT_REF_NAME: ${{ github.ref_name }}


jobs:
  env-prepare:
    runs-on: ${{ vars.GH_RUNNER_TAG_NAME || 'ubuntu-22.04' }}
    timeout-minutes: ${{ fromJSON(vars.GH_RUNNER_SCRIPT_TIMEOUT || '10') }}
    outputs:
      PACKAGE_NAME: ${{ steps.set-outputs.outputs.PACKAGE_NAME }}
    container:
      image: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}/${{ vars.DOCKER_NAMESPACE || 'netcracker' }}/${{ vars.ENVGENE_IMAGE || 'qubership-envgene' }}:${{ vars.ENVGENE_VERSION || 'feature-modern-toolset' }}
      options: --user root
      credentials:
        username: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP' && '_json_key' || github.actor }}
        password: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP' && secrets.GCP_SA_KEY || github.token }}
    env:
      #GIT CONFIG VALUES
      GITHUB_USER_EMAIL: ${{ vars.GH_USER_EMAIL || format('{0}@users.noreply.github.com', github.actor) }}
      GITHUB_USER_NAME: ${{ vars.GH_USER_NAME || github.actor }}

      #SECRETS
      GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENVGENE_AGE_PUBLIC_KEY: ${{ secrets.ENVGENE_AGE_PUBLIC_KEY }}
      ENVGENE_AGE_PRIVATE_KEY: ${{ secrets.ENVGENE_AGE_PRIVATE_KEY }}
    steps:
      - name: Repository Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Load environment variables from configuration files
        uses: ./.github/actions/load-env-files
        with:
          paths: |
            .github/pipeline_vars.env

      - name: Process Input Parameters
        env:
          WORKFLOW_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          .github/scripts/process_variables.sh

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" remote remove origin 2>/dev/null || true

      - name: Set job outputs
        id: set-outputs
        run: echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: EnvGene Execution
        run: |
          /module/scripts/utils/handle_certs.sh
          python3 /module/scripts/pipeline/resolve_env_names.py
          set -a && . ./envgene-resolved.env && set +a
          python3 /module/scripts/utils/sparse_checkout.py
          if [[ -f "${HOME}/.bashrc" ]]; then
            source "${HOME}/.bashrc"
          fi
          python3 /module/scripts/pipeline/orchestrator.py
          set -a && . envgene-vars.env && set +a
          if [[ "${PIPELINE_TYPE}" == "GITLAB_DEPLOY" ]]; then
            if [[ "${OPERATION_TYPE}" == "DEPLOY" || ( "${OPERATION_TYPE}" == "BGD" && "${BGD_OPERATION}" == "warmup" ) ]]; then
              python3 /python/argocd-dpg/src/argo/main.py generate structure -p params.environment_id="${FULL_ENV_NAME}" -p params.deployment_plan="${CI_PROJECT_DIR}/environments/${CLUSTER_NAME}/${ENVIRONMENT_NAME}/Inventory/delta-deploy-plan.yml" --log-level "${ENVGENE_LOG_LEVEL}"
              if [[ -v ENVGENE_AGE_PUBLIC_KEY ]]; then
                sops --encrypt -i --age "${ENVGENE_AGE_PUBLIC_KEY}" ARGO_DPG_CONTEXT.env
              else
                echo "Skipping argo-dpg context encryption because ENVGENE_AGE_PUBLIC_KEY is not defined"
              fi
            fi
            if [[ "${OPERATION_TYPE}" == "CLEAN" ]]; then
              export ESPUSHER_OVERWRITE="true"
            else
              export ESPUSHER_OVERWRITE="false"
            fi
            python3 /python/es-pusher/src/espusher/main.py push -p params.environment_id="${FULL_ENV_NAME}" -p params.commit_message="DEVOPS-001 Push effective set for \"${FULL_ENV_NAME}\"" -p params.overwrite="${ESPUSHER_OVERWRITE}" --log-level "${ENVGENE_LOG_LEVEL}"
          fi

          if [[ "${PIPELINE_TYPE}" != "GITLAB_DEPLOY" && "${CMDB_IMPORT}" == "true" ]]; then
            /module/scripts/cmdb_import/cmdb_import.sh
          fi

      - name: Upload generated environment package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            environments/
            configuration/
            sboms/
            templates/
            tmp/
            ARGO_DPG_CONTEXT.env
          include-hidden-files: true

  sync:
    needs: env-prepare
    if: inputs.PIPELINE_TYPE == 'GITLAB_DEPLOY' && inputs.OPERATION_TYPE != 'CLEAN'
    runs-on: ${{ vars.GH_RUNNER_TAG_NAME || 'ubuntu-22.04' }}
    timeout-minutes: ${{ fromJSON(vars.GH_RUNNER_SCRIPT_TIMEOUT || '10') }}
    container:
      image: ${{ vars.SYNCER_IMAGE }}
      options: --user root
      credentials:
        username: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP' && '_json_key' || github.actor }}
        password: ${{ vars.DOCKER_CLOUD_REGISTRY_PROVIDER == 'GCP' && secrets.GCP_SA_KEY || github.token }}
    env:
      CI_PROJECT_DIR: ${{ github.workspace }}
      SOPS_AGE_KEY: ${{ secrets.ENVGENE_AGE_PRIVATE_KEY }}
      ENVGENE_AGE_PUBLIC_KEY: ${{ secrets.ENVGENE_AGE_PUBLIC_KEY }}
      ENVGENE_AGE_PRIVATE_KEY: ${{ secrets.ENVGENE_AGE_PRIVATE_KEY }}
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      OTEL_EXPORTER_OTLP_CERTIFICATE: ""
    steps:
      - name: Download environment package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.env-prepare.outputs.PACKAGE_NAME }}

      - name: Sync
        run: |
          set -euo pipefail
          cp -r "${CI_PROJECT_DIR}/configuration/certs" "${CI_PROJECT_DIR}/ca_bundle" || true
          update-certificate
          set -a
          if [[ -n "${ENVGENE_AGE_PUBLIC_KEY:-}" ]]; then
            source <(sops -d ARGO_DPG_CONTEXT.env)
          else
            source <(cat ARGO_DPG_CONTEXT.env)
          fi
          set +a
          /usr/local/bin/uv run argo-app-life execute-by-args

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: generate_pipeline-${{ github.run_id }}
          path: |
            debug_syncer_logs*.txt
            syncer_logs*.txt
            errors-trace
            errors-trace.tar
            deploy-report.json
          if-no-files-found: ignore
          retention-days: 1
