[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envgene-linter"
version = "0.1.0"
description = "Linter for EnvGene instance repositories"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
envgene-linter = "envgene_linter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
