#     shared-read:
#       username: ref+vault://secret/data/registry/shared-read#username
#       password: ref+vault://secret/data/registry/shared-read#password
#     shared-publish:
#       username: ref+vault://secret/data/registry/shared-publish#username
#       password: ref+vault://secret/data/registry/shared-publish#password
#     shared-admin:
#       username: ref+vault://secret/data/registry/shared-admin#username
#       password: ref+vault://secret/data/registry/shared-admin#password
