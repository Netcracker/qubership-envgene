# Example 2 — Shared Platform Registry (Vault): artifactory + user_pass + external cred store

kind: RegistryDefinition
version: v2
name: shared-platform-registry-vault
authConfig:
  shared:
    provider: artifactory
    authMethod: user_pass
    baseUrl: https://artifactory.qubership.com
    scopes:
      r: shared-read
      rw: shared-publish
      rwd: shared-admin
mavenConfig:
  authConfig: shared
  repositories:
    - type: snapshot
      url: https://artifactory.qubership.com/pd.xaas.mvn.snapshots
      repoName: pd.xaas.mvn.snapshots
    - type: staging
      url: https://artifactory.qubership.com/pd.xaas.mvn.staging
      repoName: pd.xaas.mvn.staging
    - type: release
      url: https://artifactory.qubership.com/pd.xaas.mvn
      repoName: pd.xaas.mvn
    - type: snapshotGroup
      url: https://artifactory.qubership.com/pd.xaas.mvn.group
    - type: releaseGroup
      url: https://artifactory.qubership.com/pd.xaas-release.mvn.group
dockerConfig:
  authConfig: shared
  repositories:
    - type: snapshot
      url: artifactory.qubership.com:17204
      repoName: pd.xaas.docker.dev
    - type: staging
      url: artifactory.qubership.com:17202
      repoName: pd.xaas.docker.staging
    - type: release
      url: artifactory.qubership.com:17203
      repoName: pd.xaas.docker
    - type: group
      url: artifactory.qubership.com:17204
goConfig:
  authConfig: shared
  repositories:
    - type: snapshot
      url: https://artifactory.qubership.com/pd.xaas.golang.dev
      repoName: pd.xaas.golang.dev
    - type: release
      url: https://artifactory.qubership.com/pd.xaas.golang
      repoName: pd.xaas.golang
    - type: proxy
      url: https://artifactory.qubership.com/pd.xaas-release.golang.group
npmConfig:
  authConfig: shared
  repositories:
    - type: snapshot
      url: https://artifactory.qubership.com/pd.xaas.npm.dev
      repoName: pd.xaas.npm.dev
    - type: release
      url: https://artifactory.qubership.com/pd.xaas.npm
      repoName: pd.xaas.npm
helmLibConfig:
  authConfig: shared
  repositories:
    - type: staging
      url: https://artifactory.qubership.com/qs.libraries.helm.staging
      repoName: qs.libraries.helm.staging
    - type: release
      url: https://artifactory.qubership.com/qs.libraries.helm
      repoName: qs.libraries.helm
helmAppConfig:
  authConfig: shared
  repositories:
    - type: staging
      url: https://artifactory.qubership.com/qs.helm.charts.staging
      repoName: qs.helm.charts.staging
    - type: release
      url: https://artifactory.qubership.com/qs.helm.charts.release
      repoName: qs.helm.charts.release
    - type: group
      url: https://artifactory.qubership.com/qs.helm.charts
    - type: dev
      url: https://artifactory.qubership.com/qs.helm.charts.dev
      repoName: qs.helm.charts.dev

# ---------------------------------------------------------------------------
# Consumer CI/CD variable: REGISTRY_CREDENTIALS
# ---------------------------------------------------------------------------
