# Example 3 — Onsite: nexus + user_pass

kind: RegistryDefinition
version: v2
name: nexus-onsite
authConfig:
  onsite:
    provider: nexus
    authMethod: user_pass
    baseUrl: https://nexus.customer.internal
    scopes:
      r: onsite-read
      rw: onsite-publish
      rwd: onsite-admin
mavenConfig:
  authConfig: onsite
  repositories:
    - type: snapshot
      url: https://nexus.customer.internal/repository/maven-snapshots
      repoName: maven-snapshots
    - type: staging
      url: https://nexus.customer.internal/repository/maven-staging
      repoName: maven-staging
    - type: release
      url: https://nexus.customer.internal/repository/maven-releases
      repoName: maven-releases
    - type: releaseGroup
      url: https://nexus.customer.internal/repository/maven-public
dockerConfig:
  authConfig: onsite
  repositories:
    - type: snapshot
      url: nexus.customer.internal:8082
      repoName: docker-snapshots
    - type: staging
      url: nexus.customer.internal:8083
      repoName: docker-staging
    - type: release
      url: nexus.customer.internal:8084
      repoName: docker-releases
    - type: group
      url: nexus.customer.internal:8085
helmLibConfig:
  authConfig: onsite
  repositories:
    - type: staging
      url: https://nexus.customer.internal/repository/helm-lib-staging
      repoName: helm-lib-staging
    - type: release
      url: https://nexus.customer.internal/repository/helm-lib-releases
      repoName: helm-lib-releases
helmAppConfig:
  authConfig: onsite
  repositories:
    - type: staging
      url: https://nexus.customer.internal/repository/helm-app-staging
      repoName: helm-app-staging
    - type: release
      url: https://nexus.customer.internal/repository/helm-app-releases
      repoName: helm-app-releases
    - type: group
      url: https://nexus.customer.internal/repository/helm-app
    - type: dev
      url: https://nexus.customer.internal/repository/helm-app-dev
      repoName: helm-app-dev

# ---------------------------------------------------------------------------
# Consumer CI/CD variable: REGISTRY_CREDENTIALS (literal values, no secret store)
