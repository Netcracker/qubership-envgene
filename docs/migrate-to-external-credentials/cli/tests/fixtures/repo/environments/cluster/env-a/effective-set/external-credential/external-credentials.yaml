credentials:
  app-client-creds:
    vals: "ref+vault://kv/cluster/env-a/app-client-creds"
    strategy: fail_if_absent
  token2:
    vals: "ref+vault://kv/cluster/env-a/token2"
    strategy: fail_if_absent
  generated-cred:
    vals: "ref+vault://kv/cluster/env-a/generated-cred"
    strategy: create_if_absent
    data:
      username: _generateValue
      password: _generateValue
