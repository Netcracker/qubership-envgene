# BGD Environment Inventory with separate origin/peer template artifacts.
inventory:
  environmentName: "env-03"
  tenantName: "Application"
  cloudName: "sample_cloud"
  clusterUrl: "https://k8s.example.local:6443"
  description: "BGD environment with separately tracked origin/peer artifact versions"
  owners: "Platform team"
envTemplate:
  name: "bgd"
  artifact: "my-env-templates:2.0.0"
  bgNsArtifacts:
    origin: "my-env-templates:2.0.0"
    peer: "my-env-templates:2.0.0"
  additionalTemplateVariables: {}
  sharedTemplateVariables: []
  envSpecificParamsets: {}
  envSpecificTechnicalParamsets: {}
  sharedMasterCredentialFiles: []
