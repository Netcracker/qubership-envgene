# Business environment. Deploys the business solution of the cluster. Created by the pipeline from
# env-inventory-content/env-business.json. Replace the <placeholders> with the values of your project.
# No cloudPassport: the environment uses the cluster default passport.yml.
inventory: {}
envTemplate:
  name: "<business-template-name>"
  artifact: "<business-template-artifact>:<version>"
  # Variables the Environment Template expects, if any
  additionalTemplateVariables:
    "<variable>": "<value>"
  # Environment-specific parameters of a Namespace, if you need to override them
  envSpecificParamsets:
    "<namespace>":
      - "<paramset-name>"
  sharedMasterCredentialFiles:
    - "<shared-credentials-file>"
