# Infra environment. Deploys the infrastructure Solution Descriptor of the cluster. Created by the pipeline from
# env-inventory-content/env-infra.json. Replace the <placeholders> with the values of your project.
inventory:
  cloudPassport: passport-infra
envTemplate:
  name: "<infra-template-name>"
  artifact: "<infra-template-artifact>:<version>"
  # Variables the Environment Template expects, if any
  additionalTemplateVariables:
    "<variable>": "<value>"
  # Environment-specific parameters of a Namespace, if you need to override them
  envSpecificParamsets:
    "<namespace>":
      - "<paramset-name>"
  sharedMasterCredentialFiles:
    - "<shared-credentials-file>"
