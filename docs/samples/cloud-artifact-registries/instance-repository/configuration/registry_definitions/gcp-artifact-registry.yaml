version: "2.0"
name: "gcp-artifact-registry"
authConfig:
  gcp-auth:
    provider: "gcp"
    authMethod: "service_account"
    credentialsId: "gcp-artifact-registry-key"
    gcpRegion: "us-central1"
mavenConfig:
  authConfig: "gcp-auth"
  repositoryDomainName: "https://us-central1-maven.pkg.dev/my-project/my-maven-repo"
