# AWS CodeArtifact - usernamePassword credential
# username: AWS access key ID
# password: AWS secret access key
aws-codeartifact-creds:
  type: usernamePassword
  data:
    username: "access-key-id-placeholder"
    password: "secret-access-key-placeholder"

# GCP Artifact Registry - secret credential
# secret: full JSON content of the GCP service account key file
gcp-artifact-registry-key:
  type: secret
  data:
    secret: |
      {
        "type": "service_account",
        "project_id": "my-project",
        "private_key_id": "key-id-placeholder",
        "private_key": "-----BEGIN RSA PRIVATE KEY-----\nprivate-key-placeholder\n-----END RSA PRIVATE KEY-----\n",
        "client_email": "envgene-artifact-reader@my-project.iam.gserviceaccount.com",
        "client_id": "123456789",
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token"
      }
