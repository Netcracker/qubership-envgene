name: bss-tech
version: 25.1
parameters:
  CONTENT_SECURITY_POLICY: "default-src 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; img-src ; frame-src * blob:"
applications:
  - appName: crm
    parameters:
      BSS_INGRESS_ANNOTATIONS: |-
        nginx.ingress.kubernetes.io/proxy-body-size: 800m
        nginx.ingress.kubernetes.io/proxy-connect-timeout: '2000'
  - appName: cloud
    parameters:
      samplesrepository.payload.max.size: "600MB"