---
name: "prod_bss_override"
baseline: "prod"
description: "Override for dev-profile"
applications:
- name: "core-app"
  services:
  - name: "core-service"
    parameters:
    - name: "CPU_LIMIT"
      value: "10"
    - name: "MEMORY_LIMIT"
      value: "5620Mi"
    - name: "REPLICAS"
      value: "3"
    - name: "CPU_REQUEST"
      value: "150m"
- name: "bss-app"
  services:
  - name: "bss-service"
    parameters:
    - name: "CPU_LIMIT"
      value: "20"
    - name: "REPLICAS"
      value: "3"
    - name: "CPU_REQUEST"
      value: "150m"
    - name: "MEMORY_LIMIT"
      value: "336Mi"
