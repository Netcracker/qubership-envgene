---
name: "prod_billing_override"
baseline: "prod"
description: "Override for dev-profile"
applications:
- name: "billing-app"
  services:
  - name: "billing-service"
    parameters:
    - name: "CPU_LIMIT"
      value: "20"
    - name: "REPLICAS"
      value: "3"
    - name: "CPU_REQUEST"
      value: "150m"
    - name: "MEMORY_LIMIT"
      value: "336Mi"
