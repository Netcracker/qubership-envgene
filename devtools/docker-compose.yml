x-base-env: &base-env
  CI_PROJECT_DIR: /workspace
  IS_LOCAL_DEV_TEST_ENVGENE: "true"

x-base-service: &base-service
  volumes:
    - ../:/workspace
  working_dir: /workspace
  entrypoint: sleep infinity

services:
  tests:
    <<: *base-service
    environment:
      <<: *base-env
    build:
      dockerfile: devtools/tests/Dockerfile
      context: ../

  cucumber:
    <<: *base-service
    environment:
      <<: *base-env
    build:
      dockerfile: devtools/cucumber/Dockerfile
      context: ../
      # local-envgene-main is a locally built image (not on Docker Hub).
      # pull=false tells BuildKit not to attempt to pull it from a registry.
      pull: false
