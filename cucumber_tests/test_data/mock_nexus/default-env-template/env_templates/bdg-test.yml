tenant: '{{ templates_dirs.common }}/env_templates/bgd-test/Tenant.yml.j2'
cloud: '{{ templates_dirs.common }}/env_templates/bgd-test/Cloud.yml.j2'
namespaces:
  - template_path: '{{ templates_dirs.common }}/env_templates/bgd-test/Namespace.yml.j2'
    deploy_postfix: core
    template_override:
      name: "{{current_env.environmentName}}-core"
  - template_path: '{{ templates_dirs.common }}/env_templates/bgd-test/Namespace.yml.j2'
    deploy_postfix: controller
    template_override:
      name: "{{current_env.environmentName}}-controller"
  - template_path: '{{ templates_dirs.common }}/env_templates/bgd-test/Namespace.yml.j2'
    deploy_postfix: bss
    template_override:
      name: "{{current_env.environmentName}}-bss-origin"
  - template_path: '{{ templates_dirs.common }}/env_templates/bgd-test/Namespace.yml.j2'
    deploy_postfix: bss
    template_override:
      name: "{{current_env.environmentName}}-bss-peer"
bg_domain: '{{ templates_dirs.common }}/env_templates/bgd-test/BgDomain.yml.j2'
composite_structure: '{{ templates_dirs.common }}/env_templates/bgd-test/composite-structure.yml'
