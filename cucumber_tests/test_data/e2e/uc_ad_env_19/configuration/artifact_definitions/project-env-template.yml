version: "2.0"
name: project-env-template
groupId: org.test
artifactId: project-env-template
registry:
  name: nexus-maven-v2
  authConfig:
    nexus-auth:
      provider: nexus
      authMethod: user_pass
      credentialsId: nexus-creds-v2
  mavenConfig:
    authConfig: nexus-auth
    repositoryDomainName: http://localhost:8000
    targetSnapshot: release
    targetStaging: release
    targetRelease: release
    snapshotGroup: release
    releaseGroup: release
