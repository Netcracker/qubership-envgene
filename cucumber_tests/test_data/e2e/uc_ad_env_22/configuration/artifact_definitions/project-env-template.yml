version: "2.0"
name: project-env-template
groupId: org.test
artifactId: project-env-template
registry:
  name: gcp-artifact-registry-template
  authConfig:
    gcp-auth:
      provider: gcp
      authMethod: service_account
      credentialsId: gcp-sa-key
      gcpRegion: us-central1
  mavenConfig:
    authConfig: gcp-auth
    repositoryDomainName: http://localhost:8000/release
