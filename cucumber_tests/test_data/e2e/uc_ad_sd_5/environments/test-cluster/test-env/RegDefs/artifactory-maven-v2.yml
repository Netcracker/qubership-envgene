version: "2.0"
name: artifactory-maven-v2
authConfig:
  artifactory-auth:
    provider: artifactory
    authMethod: user_pass
    credentialsId: artifactory-creds-v2
mavenConfig:
  authConfig: artifactory-auth
  repositoryDomainName: http://localhost:8000
  targetSnapshot: release
  targetStaging: release
  targetRelease: release
  snapshotGroup: release
  releaseGroup: release
