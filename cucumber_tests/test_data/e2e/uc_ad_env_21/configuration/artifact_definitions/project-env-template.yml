version: "2.0"
name: project-env-template
groupId: org.test
artifactId: project-env-template
registry:
  name: aws-codeartifact-template
  authConfig:
    aws-auth:
      provider: aws
      authMethod: secret
      credentialsId: aws-secret-creds
      awsRegion: us-east-1
      awsDomain: my-domain
  mavenConfig:
    authConfig: aws-auth
    repositoryDomainName: http://localhost:8000/release
