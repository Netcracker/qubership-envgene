name: "Run E2E BDD tests"
description: "Pull a pre-built EnvGene image, start the cucumber container, and run all BDD suites"

inputs:
  envgene-image:
    description: "Already-built EnvGene image to test (registry/name:tag)"
    required: true
  github-token:
    description: "Token used to pull the image from the container registry"
    required: true
  registry:
    description: "Container registry for docker login"
    required: false
    default: "ghcr.io"
  check-name:
    description: "Name of the GitHub check for the test report"
    required: false
    default: "E2E BDD Test Results (Dev pipeline)"
  artifact-name:
    description: "Name of the uploaded test results artifact"
    required: false
    default: "e2e-test-results-dev"

runs:
  using: composite
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Pull EnvGene image and start cucumber container
      shell: bash
      env:
        ENVGENE_IMAGE: ${{ inputs.envgene-image }}
      run: |
        set -euo pipefail
        docker pull "${ENVGENE_IMAGE}"
        docker tag "${ENVGENE_IMAGE}" local-envgene-main
        docker compose -f devtools/docker-compose.yml up -d --build cucumber

    - name: Install Python packages inside container
      shell: bash
      run: |
        set -euo pipefail
        docker compose -f devtools/docker-compose.yml exec -T cucumber \
          bash -c "chmod +x /workspace/devtools/cucumber/up.sh && /workspace/devtools/cucumber/up.sh"

    - name: Run BDD test suites
      shell: bash
      run: |
        docker compose -f devtools/docker-compose.yml exec -T cucumber \
          bash /workspace/cucumber_tests/run_suites.sh

    - name: Publish Test Report
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "reports/**/*.xml"
        check_name: ${{ inputs.check-name }}

    - name: Upload test logs and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          e2e_tests.log
          reports/

    - name: Tear down
      if: always()
      shell: bash
      run: docker compose -f devtools/docker-compose.yml down
