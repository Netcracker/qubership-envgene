# This action is hidden from the GitHub Actions UI
name: 'Promote Qubership Envgene Docker Image'
description: >
  Add the final tags (branch_latest_tag, version, metadata-action tags) to an image that was
  already pushed under its custom_tag by build-envgene with push-final-tags: 'false'. Uses
  `docker buildx imagetools create`, which points new tags at the existing manifest without
  rebuilding or re-uploading any layer.

inputs:
  registry:
    description: 'Container registry URL'
    required: false
    default: 'ghcr.io'
  repository-owner:
    description: 'Repository owner for Docker images'
    required: false
    default: 'netcracker'
  image-name:
    description: 'Docker image name'
    required: false
    default: 'qubership-envgene'
  github-token:
    description: 'GitHub token for registry login'
    required: true
  source-tag:
    description: 'The already-pushed tag to promote (build-envgene output: custom_tag)'
    required: true
  branch-latest-tag:
    description: 'build-envgene output: branch_latest_tag'
    required: true
  version:
    description: 'build-envgene input: version, if one was set'
    required: false
    default: ''
  meta-tags:
    description: 'build-envgene output: meta_tags (newline-separated full image refs)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Promote image to its final tags
      shell: bash
      run: |
        set -euo pipefail
        base="${{ inputs.registry }}/${{ inputs.repository-owner }}/${{ inputs.image-name }}"
        source="${base}:${{ inputs.source-tag }}"

        tags=("${base}:${{ inputs.branch-latest-tag }}")
        if [ -n "${{ inputs.version }}" ]; then
          tags+=("${base}:${{ inputs.version }}")
        fi
        while IFS= read -r t; do
          [ -n "$t" ] && tags+=("$t")
        done <<< "${{ inputs.meta-tags }}"

        args=()
        for t in "${tags[@]}"; do
          args+=(--tag "$t")
        done

        echo "Promoting ${source} to: ${tags[*]}"
        docker buildx imagetools create "${args[@]}" "${source}"
