name: "Dev: Build or Test Qubership EnvGene docker images"

run-name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.tests-only == 'true') && format('Test EnvGene for commit {0}', github.sha) || ((github.event_name == 'push' && (contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'BREAKING CHANGE'))) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build-envgene == 'true' || github.event.inputs.build-pipeline == 'true') && github.event.inputs.tests-only == 'false')) && format('Build EnvGene for commit {0}', github.sha) || format('Test EnvGene for commit {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      tests-only:
        description: 'Run tests only'
        required: false
        default: false
        type: boolean
      build-envgene:
        description: 'Build Qubership Envgene image'
        required: false
        default: true
        type: boolean
      build-pipeline:
        description: 'Build Instance Repo Pipeline image'
        required: false
        default: true
        type: boolean
      build-gsf-instance:
        description: 'Build GSF Instance image'
        required: false
        default: true
        type: boolean
      build-gsf-discovery:
        description: 'Build GSF Discovery image'
        required: false
        default: true
        type: boolean
  push: null

env:
  REGISTRY: ghcr.io
  CI_PROJECT_DIR: ${{ github.workspace }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  conventional-commits:
    permissions:
      contents: read
      packages: write
      statuses: write
      pull-requests: read
    uses: ./.github/workflows/pr-conventional-commits.yaml

  link-check:
    needs: [conventional-commits]
    permissions:
      contents: read
      packages: write
      statuses: write
    uses: ./.github/workflows/link-checker.yaml

  linters:
    needs: [conventional-commits]
    permissions:
      contents: read
      packages: write
      statuses: write
    uses: ./.github/workflows/super-linter.yaml
    with:
      full_scan: false

  tests:
    needs: [conventional-commits]
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Tests
        uses: ./.github/actions/run-tests

  build-qubership-envgene:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.build-envgene == 'true' && github.event.inputs.tests-only == 'false') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'BREAKING CHANGE')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      custom_tag: ${{ steps.build-envgene.outputs.custom_tag }}
      branch_tag: ${{ steps.build-envgene.outputs.branch_tag }}
      timestamp: ${{ steps.build-envgene.outputs.timestamp }}
      branch_latest_tag: ${{ steps.build-envgene.outputs.branch_latest_tag }}
      image_ref: ${{ steps.build-envgene.outputs.image_ref }}
      meta_tags: ${{ steps.build-envgene.outputs.meta_tags }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Pushes only the custom_tag (scratch tag). branch_latest_tag / version / metadata tags are
    # NOT live in the registry yet - the promote-qubership-envgene job adds them once e2e-tests
    # passes, so nothing pulls a broken image under a "real" tag.
    - name: Build Qubership Envgene Docker Image
      uses: ./.github/actions/build-envgene
      id: build-envgene
      with:
        registry: ${{ env.REGISTRY }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-final-tags: 'false'

  e2e-tests:
    needs: [build-qubership-envgene]
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: read
    uses: ./.github/workflows/perform_e2e_tests.yml
    with:
      image-ref: ${{ needs.build-qubership-envgene.outputs.image_ref }}

  promote-qubership-envgene:
    needs: [build-qubership-envgene, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Promote tested image to its final tags
        uses: ./.github/actions/promote-envgene
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          source-tag: ${{ needs.build-qubership-envgene.outputs.custom_tag }}
          branch-latest-tag: ${{ needs.build-qubership-envgene.outputs.branch_latest_tag }}
          meta-tags: ${{ needs.build-qubership-envgene.outputs.meta_tags }}

  build-instance-repo-pipeline:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build-pipeline == 'true') ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'BREAKING CHANGE')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: "Prepare app token"
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Build Instance Repo Pipeline Docker Image
        uses: ./.github/actions/build-pipeline
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-gsf-instance:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build-gsf-instance == 'true') ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'BREAKING CHANGE')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: "Prepare app token"
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Build GSF Instance Docker Image
        uses: ./.github/actions/build-gsf-instance
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-gsf-discovery:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build-gsf-discovery == 'true') ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'BREAKING CHANGE')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: "Prepare app token"
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Build GSF Discovery Docker Image
        uses: ./.github/actions/build-gsf-discovery
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
