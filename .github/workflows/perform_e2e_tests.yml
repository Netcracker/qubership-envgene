name: "E2E BDD Tests"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_call:
    inputs:
      image-ref:
        description: >
          Full ref of an already-built local-envgene-main image to pull instead of building from
          source (e.g. ghcr.io/netcracker/qubership-envgene:main_20260101-000000). Leave unset to
          build from the checked-out source, as on a standalone push/pull_request run.
        required: false
        type: string
        default: ''

jobs:
  eig-e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_call'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built production image
        if: github.event_name == 'workflow_call'
        run: |
          docker pull "${{ inputs.image-ref }}"
          docker tag "${{ inputs.image-ref }}" local-envgene-main

      - name: Build production image from source
        if: github.event_name != 'workflow_call'
        run: docker build -t local-envgene-main -f build_envgene/build/Dockerfile .

      - name: Start cucumber container
        run: docker compose -f devtools/docker-compose.yml up -d --build cucumber

      - name: Install Python packages inside container
        run: |
          docker compose -f devtools/docker-compose.yml exec -T cucumber \
            bash -c "chmod +x /workspace/devtools/cucumber/up.sh && /workspace/devtools/cucumber/up.sh"

      - name: Run Environment Inventory Generation BDD tests
        run: |
          mkdir -p reports
          docker compose -f devtools/docker-compose.yml exec -T cucumber bash -c \
            "set -o pipefail && \
             export PYTHONPATH=/workspace && \
             cd /workspace && \
             pytest cucumber_tests/step_defs/test_environment_inventory_generation.py \
               -v -s \
               --junitxml=reports/environment_inventory_generation.xml \
               | tee /workspace/e2e_tests.log"

      - name: Run SBOM Retention BDD tests
        run: |
          docker compose -f devtools/docker-compose.yml exec -T cucumber bash -c \
            "set -o pipefail && \
             export PYTHONPATH=/workspace && \
             cd /workspace && \
             pytest cucumber_tests/step_defs/test_sbom_retention.py \
               -v -s \
               --junitxml=reports/sbom_retention.xml \
               | tee -a /workspace/e2e_tests.log"


      - name: Run BGD Sub-flows BDD tests
        run: |
          docker compose -f devtools/docker-compose.yml exec -T cucumber bash -c \
            "set -o pipefail && \
             export PYTHONPATH=/workspace && \
             cd /workspace && \
             pytest cucumber_tests/step_defs/test_bgd_sub_flows.py \
               -v -s \
               --junitxml=reports/bgd_sub_flows.xml \
               | tee -a /workspace/e2e_tests.log"

      - name: Run CLEAN Sub-flows BDD tests
        run: |
          docker compose -f devtools/docker-compose.yml exec -T cucumber bash -c \
            "set -o pipefail && \
             export PYTHONPATH=/workspace && \
             cd /workspace && \
             pytest cucumber_tests/step_defs/test_clean_sub_flows.py \
               -v -s \
               --junitxml=reports/clean_sub_flows.xml \
               | tee -a /workspace/e2e_tests.log"

      - name: Run Calculator CLI BDD tests
        run: |
          docker compose -f devtools/docker-compose.yml exec -T cucumber bash -c \
            "export PYTHONPATH=/workspace && \
             cd /workspace && \
             pytest cucumber_tests/step_defs/test_calculator_cli.py \
               -v -s \
               --junitxml=reports/calculator_cli.xml \
               | tee -a /workspace/e2e_tests.log"

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "reports/**/*.xml"
          check_name: "E2E BDD Test Results"

      - name: Upload test logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e_tests.log
            reports/

      - name: Tear down
        if: always()
        run: |
          docker compose -f devtools/docker-compose.yml down
