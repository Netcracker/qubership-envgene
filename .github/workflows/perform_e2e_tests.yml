name: "E2E BDD Tests — Environment Inventory Generation"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  eig-e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout this repository (destination)
        uses: actions/checkout@v4
        with:
          path: qubership-envgene-part

      - name: Checkout source repository (envgene Python packages)
        uses: actions/checkout@v4
        with:
          repository: netcracker/qubership-envgene
          path: qubership-envgene

      - name: Build and start cucumber container
        working-directory: qubership-envgene-part
        run: |
          docker compose -f devtools/docker-compose.yml up -d --build cucumber

      - name: Install Python packages from source repo
        working-directory: qubership-envgene-part
        run: |
          docker compose -f devtools/docker-compose.yml exec -T cucumber \
            bash -c "chmod +x /workspace/devtools/cucumber/up.sh && /workspace/devtools/cucumber/up.sh"

      - name: Run Environment Inventory Generation BDD tests
        working-directory: qubership-envgene-part
        run: |
          mkdir -p reports
          docker compose -f devtools/docker-compose.yml exec -T cucumber bash -c \
            "export PYTHONPATH=/workspace:/envgene-src && \
             cd /workspace && \
             pytest tests/step_defs/test_environment_inventory_generation.py \
               -v -s \
               --junitxml=reports/environment_inventory_generation.xml \
               | tee /workspace/e2e_tests.log"

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "qubership-envgene-part/reports/**/*.xml"
          check_name: "EIG BDD Test Results"

      - name: Upload test logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eig-test-results
          path: |
            qubership-envgene-part/e2e_tests.log
            qubership-envgene-part/reports/

      - name: Tear down
        if: always()
        working-directory: qubership-envgene-part
        run: |
          docker compose -f devtools/docker-compose.yml down
