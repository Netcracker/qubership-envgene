# Builds, tests, and publishes qubership-envgene-linter to PyPI.
# Publish runs on upstream main and feature/envgene-linter-dev.
# Forks and other refs are build-only: validate, test, artifact upload; no PyPI upload.
# Required repository secret: PYPI_API_TOKEN.
# Required for version sync on a protected branch: vars GH_BUMP_VERSION_APP_ID, secret GH_BUMP_VERSION_APP_KEY.
# Operator notes: modules/envgene-linter/docs/releasing.md
# Helper scripts: .github/scripts/pypi/

name: "Publish to PyPI: qubership-envgene-linter"

run-name: "Publish to PyPI: qubership-envgene-linter v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in strict semver format: 0.0.0"
        required: true
        type: string

concurrency:
  group: pypi-envgene-linter
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_DIR: modules/envgene-linter
  PACKAGE_NAME: qubership-envgene-linter
  CLI_NAME: envgene-linter
  UPSTREAM_REPO: Netcracker/qubership-envgene
  PYPI_RETRY_ATTEMPTS: 3
  PYPI_RETRY_DELAY_SECONDS: 30
  PYPI_SCRIPTS_DIR: .github/scripts/pypi
  POETRY_VERSION: "2.1.3"
  SMOKE_REPO: testdata/rules/name2/ok

jobs:
  gate:
    name: Determine publish mode
    runs-on: ubuntu-latest
    outputs:
      can_publish: ${{ steps.mode.outputs.can_publish }}

    steps:
      - name: Set build-only or publish mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          can_publish=false
          ref="${{ github.ref }}"

          if [[ "${{ github.event.repository.fork }}" != "true" ]] \
            && [[ "${{ github.repository }}" == "${UPSTREAM_REPO}" ]] \
            && [[ "${ref}" == "refs/heads/main" || "${ref}" == "refs/heads/feature/envgene-linter-dev" ]]; then
            can_publish=true
          fi

          echo "can_publish=${can_publish}" >> "${GITHUB_OUTPUT}"

          if [[ "${can_publish}" == "true" ]]; then
            echo "Publish mode: PyPI upload and repository version sync are enabled."
          else
            echo "Build-only mode: build, test, and artifact upload will run."
            echo "Publish and repository version sync are skipped."
            echo "Repository: ${{ github.repository }}"
            echo "Ref: ${ref}"
          fi

  validate-input:
    name: Validate release version
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/pyproject.toml

      - name: Install PyPI version check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packaging

      - name: Validate semver format
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python "${PYPI_SCRIPTS_DIR}/check_pypi_version.py" \
            --package-name "${PACKAGE_NAME}" \
            --version "${VERSION}" \
            --semver-only

      - name: Validate PyPI version bump
        if: needs.gate.outputs.can_publish == 'true'
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source "${PYPI_SCRIPTS_DIR}/retry_command.sh"

          retry_command "${PYPI_RETRY_ATTEMPTS}" "${PYPI_RETRY_DELAY_SECONDS}" "2" \
            "PyPI query failed" -- \
            python "${PYPI_SCRIPTS_DIR}/check_pypi_version.py" \
              --package-name "${PACKAGE_NAME}" \
              --version "${VERSION}"

  build-package:
    name: Build and verify package
    needs:
      - gate
      - validate-input
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/pyproject.toml

      - name: Install build, test, and check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${POETRY_VERSION}"

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail

          test -d "${PROJECT_DIR}"
          test -f "${PROJECT_DIR}/pyproject.toml"
          test -f "${PROJECT_DIR}/README.md"
          test -f "${PROJECT_DIR}/PYPI_README.md"
          test -d "${PROJECT_DIR}/src/envgene_linter"
          test -f "${PROJECT_DIR}/scripts/check_dist.py"
          test -d "${PROJECT_DIR}/${SMOKE_REPO}/environments"
          grep -q "^${CLI_NAME} =" "${PROJECT_DIR}/pyproject.toml"

          echo "OK: project structure is valid."

      - name: Set release version in pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python "${PYPI_SCRIPTS_DIR}/set_pyproject_version.py" \
            --pyproject "${PROJECT_DIR}/pyproject.toml" \
            --package-name "${PACKAGE_NAME}" \
            --version "${VERSION}"

      - name: Print release version
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f'{data["project"]["name"]} {data["project"]["version"]}')
          PY

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"
          python -m pip install -e '.[dev]'

          echo "Running envgene-linter tests..."
          python -m pytest --junitxml=test-results.xml
          echo ""
          echo "OK: all tests passed."

      - name: Write unit test summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          {
            echo "## Unit tests"
            echo ""
            echo "Pytest suite for \`envgene_linter\`."
            echo ""
            if [[ -f test-results.xml ]]; then
              tests="$(grep -oE 'tests="[0-9]+"' test-results.xml | head -1 | grep -oE '[0-9]+')"
              failures="$(grep -oE 'failures="[0-9]+"' test-results.xml | head -1 | grep -oE '[0-9]+')"
              errors="$(grep -oE 'errors="[0-9]+"' test-results.xml | head -1 | grep -oE '[0-9]+')"
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Tests | ${tests:-0} |"
              echo "| Failures | ${failures:-0} |"
              echo "| Errors | ${errors:-0} |"
            else
              echo "JUnit report was not produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build sdist and wheel
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"
          poetry build

      - name: Check project and distribution metadata
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"
          poetry check
          python -m pip install twine
          python -m twine check --strict dist/*
          python scripts/check_dist.py

      - name: Smoke test installed wheel and CLI
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          wheel_count="$(find dist -maxdepth 1 -name '*.whl' | wc -l)"
          if [[ "${wheel_count}" -ne 1 ]]; then
            echo "ERROR: expected exactly one wheel in dist/, found ${wheel_count}"
            find dist -maxdepth 1 -name '*.whl' -print
            exit 1
          fi

          WHEEL_FILE="$(find dist -maxdepth 1 -name '*.whl' | head -n 1)"

          python -m venv .venv-smoke
          source .venv-smoke/bin/activate

          python -m pip install --upgrade pip
          echo "Installing wheel: ${WHEEL_FILE}"
          python -m pip install "${WHEEL_FILE}"
          python -m pip check

          command -v "${CLI_NAME}"
          "${CLI_NAME}" --help
          "${CLI_NAME}" check --help
          "${CLI_NAME}" check "${SMOKE_REPO}"

          echo "OK: CLI entrypoint works."

      - name: List built distributions
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"
          ls -lah dist/

      - name: Write build summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          CAN_PUBLISH: ${{ needs.gate.outputs.can_publish }}
        shell: bash
        run: |
          {
            echo "## Build: ${PACKAGE_NAME}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | \`${PACKAGE_NAME}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Artifact | \`${PACKAGE_NAME}-dist-${VERSION}\` |"
            if [[ "${CAN_PUBLISH}" == "true" ]]; then
              echo "| Mode | Publish |"
            else
              echo "| Mode | Build-only |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-dist-${{ inputs.version }}
          path: ${{ env.PROJECT_DIR }}/dist/*
          retention-days: 14

  publish-package:
    name: Publish to PyPI
    needs:
      - gate
      - build-package
    if: needs.gate.outputs.can_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${POETRY_VERSION}" packaging

      - name: Set release version in pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python "${PYPI_SCRIPTS_DIR}/set_pyproject_version.py" \
            --pyproject "${PROJECT_DIR}/pyproject.toml" \
            --package-name "${PACKAGE_NAME}" \
            --version "${VERSION}"

      - name: Verify PyPI connectivity and token
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source "${PYPI_SCRIPTS_DIR}/retry_command.sh"

          retry_command "${PYPI_RETRY_ATTEMPTS}" "${PYPI_RETRY_DELAY_SECONDS}" "2" \
            "PyPI connectivity check failed" -- \
            python "${PYPI_SCRIPTS_DIR}/check_pypi_credentials.py" \
              --package-name "${PACKAGE_NAME}"

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.PACKAGE_NAME }}-dist-${{ inputs.version }}
          path: ${{ env.PROJECT_DIR }}/dist

      - name: Validate artifacts to publish
        shell: bash
        run: |
          set -euo pipefail

          dist_dir="${PROJECT_DIR}/dist"

          wheel_count="$(find "${dist_dir}" -maxdepth 1 -name '*.whl' | wc -l)"
          sdist_count="$(find "${dist_dir}" -maxdepth 1 -name '*.tar.gz' | wc -l)"

          if [[ "${wheel_count}" -ne 1 ]]; then
            echo "ERROR: expected exactly one wheel to publish, found ${wheel_count}"
            find "${dist_dir}" -maxdepth 1 -name '*.whl' -print
            exit 1
          fi

          if [[ "${sdist_count}" -ne 1 ]]; then
            echo "ERROR: expected exactly one sdist to publish, found ${sdist_count}"
            find "${dist_dir}" -maxdepth 1 -name '*.tar.gz' -print
            exit 1
          fi

          ls -lah "${dist_dir}/"
          echo "OK: publish artifacts are valid."

      - name: Publish package to PyPI
        shell: bash
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          source "${PYPI_SCRIPTS_DIR}/retry_command.sh"

          cd "${PROJECT_DIR}"

          retry_command "${PYPI_RETRY_ATTEMPTS}" "${PYPI_RETRY_DELAY_SECONDS}" "any" \
            "PyPI upload failed" -- \
            poetry publish --no-interaction

      - name: Verify published version on PyPI
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source "${PYPI_SCRIPTS_DIR}/retry_command.sh"

          retry_command "${PYPI_RETRY_ATTEMPTS}" "${PYPI_RETRY_DELAY_SECONDS}" "2 3" \
            "PyPI verification pending" -- \
            python "${PYPI_SCRIPTS_DIR}/check_pypi_version.py" \
              --package-name "${PACKAGE_NAME}" \
              --version "${VERSION}" \
              --verify-published

      - name: Write publish summary
        if: success()
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          {
            echo "## PyPI release: ${PACKAGE_NAME}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | \`${PACKAGE_NAME}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| CLI | \`${CLI_NAME}\` |"
            echo "| PyPI | [${PACKAGE_NAME} ${VERSION}](https://pypi.org/project/${PACKAGE_NAME}/${VERSION}/) |"
          } >> "${GITHUB_STEP_SUMMARY}"

  sync-repo-version:
    name: Sync repository version
    needs:
      - gate
      - publish-package
    if: needs.gate.outputs.can_publish == 'true' && needs.publish-package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Prepare app token
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set release version in pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python "${PYPI_SCRIPTS_DIR}/set_pyproject_version.py" \
            --pyproject "${PROJECT_DIR}/pyproject.toml" \
            --package-name "${PACKAGE_NAME}" \
            --version "${VERSION}"

      - name: Commit version bump
        id: sync
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PROJECT_DIR}/pyproject.toml"

          if git diff --staged --quiet; then
            echo "OK: repository version already matches release ${VERSION}."
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            echo "commit_sha=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "chore: bump ${PACKAGE_NAME} version to ${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "committed=true" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "OK: repository version synced to ${VERSION}."

      - name: Write sync summary
        if: success()
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          {
            echo "## Repository version sync"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | \`${PACKAGE_NAME}\` |"
            echo "| Version | \`${VERSION}\` |"
            if [[ "${{ steps.sync.outputs.committed }}" == "true" ]]; then
              commit_sha="${{ steps.sync.outputs.commit_sha }}"
              short_sha="${commit_sha:0:7}"
              echo "| Sync commit | [\`${short_sha}\`](https://github.com/${{ github.repository }}/commit/${commit_sha}) |"
            else
              echo "| Sync commit | skipped (version already matched) |"
            fi
            echo "| PyPI | [${PACKAGE_NAME} ${VERSION}](https://pypi.org/project/${PACKAGE_NAME}/${VERSION}/) |"
          } >> "${GITHUB_STEP_SUMMARY}"
