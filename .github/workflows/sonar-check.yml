name: Sonar Check

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip_tests_and_build: ${{ steps.scope.outputs.skip_tests_and_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine CI scope
        id: scope
        run: python3 .github/scripts/ci_scope.py

  mvn-build:
    needs: [check-changes]
    if: ${{ !cancelled() && needs.check-changes.outputs.skip_tests_and_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build java
        uses: netcracker/qubership-workflow-hub/actions/maven-snapshot-deploy@main
        with:
          java-version: 17
          pom-file: build_effective_set_generator/pom.xml
          # Default target-store is "central"; the action then adds -Pcentral and GPG runs. Sonar only needs -Pgithub.
          target-store: github
          maven-command: >
            --batch-mode clean verify
            org.sonarsource.scanner.maven:sonar-maven-plugin:${{ vars.SONAR_PLUGIN_VERSION }}:sonar
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          maven-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
