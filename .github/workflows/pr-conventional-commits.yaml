---

  name: Conventional Commits PR Check

  on:
    pull_request:
      types:
        - opened
        - edited
        - synchronize
    workflow_call:
      outputs:
        skip_tests_and_build:
          description: "Skip tests and builds for documentation changes"
          value: ${{ jobs.build.outputs.skip_tests_and_build }}
        run_tests:
          description: "Run development unit tests"
          value: ${{ jobs.build.outputs.run_tests }}
        build_envgene:
          description: "Build the development EnvGene image"
          value: ${{ jobs.build.outputs.build_envgene }}
        build_gsf_instance:
          description: "Build the development GSF Instance image"
          value: ${{ jobs.build.outputs.build_gsf_instance }}
        build_gsf_discovery:
          description: "Build the development GSF Discovery image"
          value: ${{ jobs.build.outputs.build_gsf_discovery }}

  permissions:
    contents: read
    pull-requests: read
  jobs:
    build:
      name: Conventional Commits
      runs-on: ubuntu-latest
      outputs:
        skip_tests_and_build: ${{ steps.scope.outputs.skip_tests_and_build }}
        run_tests: ${{ steps.scope.outputs.run_tests }}
        build_envgene: ${{ steps.scope.outputs.build_envgene }}
        build_gsf_instance: ${{ steps.scope.outputs.build_gsf_instance }}
        build_gsf_discovery: ${{ steps.scope.outputs.build_gsf_discovery }}
      steps:
        - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
          with:
            fetch-depth: 0
            persist-credentials: false

        - name: Determine CI scope
          id: scope
          run: python3 .github/scripts/ci_scope.py

        - uses: webiny/action-conventional-commits@v1.3.0
