name: "Release: EnvGene"

run-name: "Release EnvGene: ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: '1.0.0'
        type: string
        description: 'Release version (e.g., 1.0.0)'
      publish:
        required: false
        default: true
        type: boolean
        description: 'Publish the GitHub release (images are always pushed)'

concurrency:
  group: envgene-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CI_PROJECT_DIR: ${{ github.workspace }}

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: python:3.12-slim-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Tests
        uses: ./.github/actions/run-tests

  check-tag:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - name: Input parameters
        run: |
          echo "Version: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if tag exists
        id: check_tag
        uses: netcracker/qubership-workflow-hub/actions/tag-checker@v1.0.3
        with:
          tag: 'v${{ inputs.version }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output result
        run: |
          echo "Tag exists: ${{ steps.check_tag.outputs.exists }}"
          echo "Tag name: v${{ inputs.version }}"

      - name: Fail if tag exists
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Tag already exists: v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Tag already exists: v${{ inputs.version }}"
          exit 1

  bump-versions:
    name: Bump versions
    needs: [tests, check-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      promotable: ${{ steps.bump.outputs.promotable }}
      wip_ref: ${{ steps.bump.outputs.wip_ref }}
    steps:
      - name: Prepare app token
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Bump EnvGene version in pipeline and GSF
        id: bump
        run: |
          TARGET_FILE="github_workflows/instance-repo-pipeline/.github/workflows/Envgene.yml"
          ENVGENE_COOKIECUTTER_JSON_FILE="gsf_packages/envgene_instance_project/git-system-follower-package/scripts/templates/default/cookiecutter.json"
          GSF_INSTANCE_PACKAGE_FILE="gsf_packages/envgene_instance_project/git-system-follower-package/package.yaml"
          GSF_DISCOVERY_PACKAGE_FILE="gsf_packages/envgene_discovery_project/git-system-follower-package/package.yaml"
          NEW_TAG="${{ inputs.version }}"
          WIP_REF="refs/release-wip/${NEW_TAG}"

          sed -i "s/vars.ENVGENE_VERSION || '[^']*'/vars.ENVGENE_VERSION || '${NEW_TAG}'/" "$TARGET_FILE"
          sed -i 's/"envgene_version": "[^"]*"/"envgene_version": "'"${NEW_TAG}"'"/' "$ENVGENE_COOKIECUTTER_JSON_FILE"
          sed -i "/version:/c\\version: ${NEW_TAG}" "$GSF_INSTANCE_PACKAGE_FILE"
          sed -i "/version:/c\\version: ${NEW_TAG}" "$GSF_DISCOVERY_PACKAGE_FILE"

          git diff

          git config --global user.name "qubership-actions[bot]"
          git config --global user.email "qubership-actions[bot]@users.noreply.github.com"
          git add \
            "$TARGET_FILE" \
            "$ENVGENE_COOKIECUTTER_JSON_FILE" \
            "$GSF_INSTANCE_PACKAGE_FILE" \
            "$GSF_DISCOVERY_PACKAGE_FILE"
          echo "wip_ref=${WIP_REF}" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet --cached; then
            git commit -m "chore: Update envgene image version for branch ${{ github.ref_name }} [skip ci]"
            git push origin "HEAD:${WIP_REF}"
            echo "promotable=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit - working tree clean"
            echo "promotable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-qubership-envgene:
    name: Build EnvGene
    needs: [bump-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      custom_tag: ${{ steps.build-envgene.outputs.custom_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Qubership Envgene Docker Image
        uses: ./.github/actions/build-envgene
        id: build-envgene
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          ref: ${{ needs.bump-versions.outputs.promotable == 'true' && needs.bump-versions.outputs.wip_ref || needs.bump-versions.outputs.sha }}

  e2e-bdd-tests:
    name: E2E BDD Tests
    needs: [build-qubership-envgene]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run E2E BDD tests
        uses: ./.github/actions/run-e2e-bdd
        with:
          envgene-image: ${{ env.REGISTRY }}/netcracker/qubership-envgene:${{ needs.build-qubership-envgene.outputs.custom_tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: E2E BDD Test Results (Release)
          artifact-name: e2e-test-results-release

  build-instance-repo-pipeline:
    name: Build Instance pipeline
    needs: [bump-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Instance Repo Pipeline Docker Image
        uses: ./.github/actions/build-pipeline
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          ref: ${{ needs.bump-versions.outputs.promotable == 'true' && needs.bump-versions.outputs.wip_ref || needs.bump-versions.outputs.sha }}

  build-gsf-envgene-instance:
    name: Build GSF instance
    needs: [bump-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build GSF Envgene Instance
        uses: ./.github/actions/build-gsf-instance
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          ref: ${{ needs.bump-versions.outputs.promotable == 'true' && needs.bump-versions.outputs.wip_ref || needs.bump-versions.outputs.sha }}

  build-gsf-envgene-discovery:
    name: Build GSF discovery
    needs: [bump-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build GSF Envgene Discovery
        uses: ./.github/actions/build-gsf-discovery
        with:
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          ref: ${{ needs.bump-versions.outputs.promotable == 'true' && needs.bump-versions.outputs.wip_ref || needs.bump-versions.outputs.sha }}

  promote-git:
    name: Promote version bump
    needs:
      - bump-versions
      - build-qubership-envgene
      - e2e-bdd-tests
      - build-instance-repo-pipeline
      - build-gsf-envgene-instance
      - build-gsf-envgene-discovery
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare app token
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Fast-forward branch to the release commit
        env:
          RELEASE_SHA: ${{ needs.bump-versions.outputs.sha }}
          PROMOTABLE: ${{ needs.bump-versions.outputs.promotable }}
          WIP_REF: ${{ needs.bump-versions.outputs.wip_ref }}
        run: |
          set -euo pipefail
          if [[ "${PROMOTABLE}" != "true" ]]; then
            echo "No version-bump commit to promote"
            exit 0
          fi
          git fetch origin "${WIP_REF}"
          git push origin "${RELEASE_SHA}:${{ github.ref_name }}"
          git push origin ":${WIP_REF}"

  cleanup-wip-ref:
    name: Drop unused release WIP ref
    needs: [bump-versions, promote-git]
    if: always() && needs.bump-versions.result == 'success' && needs.bump-versions.outputs.promotable == 'true' && needs.promote-git.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare app token
        if: ${{ vars.GH_BUMP_VERSION_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Delete WIP ref
        env:
          WIP_REF: ${{ needs.bump-versions.outputs.wip_ref }}
        run: git push origin ":${WIP_REF}" || true

  tag:
    name: Create tag
    needs:
      - bump-versions
      - promote-git
    permissions:
      contents: write
    uses: netcracker/qubership-workflow-hub/.github/workflows/tag-creator.yml@v1.0.3
    with:
      tag-name: v${{ inputs.version }}
      ref: ${{ needs.bump-versions.outputs.sha }}

  github-release:
    name: GitHub Release
    needs:
      - tag
      - bump-versions
    permissions:
      contents: write
    uses: netcracker/qubership-workflow-hub/.github/workflows/release-drafter.yml@v2.0.5
    with:
      version: ${{ inputs.version }}
      publish: ${{ github.event.inputs.publish }}
      ref: ${{ needs.bump-versions.outputs.sha }}
      tag: v${{ inputs.version }}
