name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'


categories:
  - title: '💥 Breaking Changes'
    labels:
      - breaking-change
  - title: '💡 New Features'
    labels:
      - feature
      - enhancement
  - title: '🐞 Bug Fixes'
    labels:
      - bug
      - fix
      - bugfix
  - title: '⚙️ Technical Debt'
    labels:
      - refactor
  - title: '📝 Documentation'
    labels:
      - documentation

change-template: "- (#$NUMBER) $TITLE by @$AUTHOR"

no-changes-template: 'No significant changes'

template: |
  ## 🚀 Release

  ### What's Changed
  $CHANGES

  ---

  ### 🐳 Docker Images

  - **[qubership-pipegene](https://github.com/$OWNER/$REPOSITORY/pkgs/container/qubership-pipegene)** - `ghcr.io/netcracker/qubership-pipegene:$RESOLVED_VERSION`
  - **[qubership-envgene](https://github.com/$OWNER/$REPOSITORY/pkgs/container/qubership-envgene)** - `ghcr.io/netcracker/qubership-envgene:$RESOLVED_VERSION`
  - **[qubership-effective-set-generator](https://github.com/$OWNER/$REPOSITORY/pkgs/container/qubership-effective-set-generator)** - `ghcr.io/netcracker/qubership-effective-set-generator:$RESOLVED_VERSION`
  - **[qubership-envgene-instance-pipeline-github](https://github.com/$OWNER/$REPOSITORY/pkgs/container/qubership-instance-repo-pipeline)** - `ghcr.io/netcracker/qubership-instance-repo-pipeline:$RESOLVED_VERSION`
  - **[qubership-envgene-instance-gsf-gitlab](https://github.com/$OWNER/$REPOSITORY/pkgs/container/qubership-gsf-instance)** - `ghcr.io/netcracker/qubership-gsf-instance:$RESOLVED_VERSION`
  - **[qubership-envgene-discovery-gsf-gitlab](https://github.com/$OWNER/$REPOSITORY/pkgs/container/qubership-gsf-discovery)** - `ghcr.io/netcracker/qubership-gsf-discovery:$RESOLVED_VERSION`

  ### 📦 PyPI Packages

  - **[qubership-external-cred-provision:1.0.2](https://pypi.org/project/qubership-external-cred-provision/1.0.2/)**

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
  patch:
    labels:
      - patch
  default: patch
