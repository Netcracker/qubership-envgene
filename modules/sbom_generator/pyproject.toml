[build-system]
requires = ["setuptools>=61,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom_generator"
version = "1.0.0"
requires-python = "~=3.12"
dependencies = [
    "pydantic==2.13.2",
    "requests==2.32.3",
    "py-serializable==2.0.0",
    "cyclonedx-python-lib[json-validation]==10.0.0",
    "packageurl-python==0.17.6",
    "deepdiff==8.6.2",
    "PyYAML==6.0.2",
    "responses==0.25.7",
    "jsonschema==4.24.1",
    "jschon-sort==0.2.0",
    "aiohttp==3.13.3",
    "asyncio==3.4.3",
    "aioresponses==0.7.8",
    "deepmerge==2.0",
    "flatten_dict==0.4.2",
    "artifact_searcher==1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==1.0.0",
    "pytest-aiohttp==1.1.0",
    "ruff==0.11.0",
    "junitparser==5.0.0",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs"]

[tool.setuptools.package-data]
sbom_generator = ["schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"