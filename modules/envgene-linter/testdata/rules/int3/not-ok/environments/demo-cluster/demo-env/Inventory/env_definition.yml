# Synthetic INT-3 example. All four references have local files.
inventory:
  environmentName: "demo-env"
envTemplate:
  name: "composite"
  envSpecificParamsets:
    cloud:
      - "service-deploy"
  envSpecificResourceProfiles:
    cloud: "demo-profile"
  sharedMasterCredentialFiles:
    - "shared-creds"
  sharedTemplateVariables:
    - "shared-vars"
