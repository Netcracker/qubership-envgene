name: envgene-component
version: 1
description: EnvGene component flow - proposal → specs → handoff-design → tasks (propose gate) → dev-design → implement
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior, not the work in this change. Use kebab-case for path segments you introduce and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Keep it concise (1-2 pages). Focus on the "why" not the "how".
      This is the document the component owner approves at the propose gate, together with the specs and tasks.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan. Describe observable behavior,
      inputs, outputs, error conditions and testable scenarios. Avoid internal names, library
      choices and step-by-step plans.

      Create one spec file per capability listed in the proposal's Capabilities section.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`).
      - Every requirement MUST have at least one scenario.

      New capabilities only: the delta spec starts with `## Purpose` (50+ characters).
      Do NOT add `## Purpose` to a delta for an existing capability.
    requires:
      - proposal

  - id: handoff-design
    generates: design.md
    description: Cross-component slice of the JCPR plan for this component - contracts, order and dependencies. Written by the analysis side, not a design of how to implement.
    template: design.md
    instruction: |
      Create the hand-off design: this component's slice of the JCPR plan from the ai-workspace.
      It describes WHAT this component must provide to and receive from the other components,
      not HOW the component implements it.

      Sections:
      - **Context**: See proposal.md - Why. Name the JCPR and the plan row for this component.
      - **Contracts**: Every interface this component provides or consumes, with the other
        component and the agreed shape. One line per contract, with an id (for example C-1),
        because the dev design must cover each id.
      - **Order and dependencies**: What must be merged first, and what waits on this component.
      - **Open Questions**: Only items the plan has not settled. Omit if none.

      Do not copy the spec requirements here. Point to the specs instead.
      The dev design of the component decides how; do not decide it here.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work for this component.

      Tasks are approved at the propose gate together with the proposal, the specs and the
      hand-off design. If the dev design later changes the scope or the set of tasks, the change
      goes back to the propose gate; a change that only refines the implementation may update
      the tasks without a new approval.

      **IMPORTANT: Follow the template below for tracked tasks.** Each tracked task MUST be a
      checkbox: `- [ ] X.Y Task description`, and states how to verify completion.

      Reference specs for what needs to be built.
    requires:
      - specs
      - handoff-design

  - id: dev-design
    generates: dev-design.md
    description: Component team's design decision for the change - approaches, the chosen one, constraints. Written after the propose gate and before plan.
    template: dev-design.md
    instruction: |
      Create the dev design: the component team's decision on HOW this change is implemented.
      It is written after the propose gate, so the owner has already approved WHAT is changed.

      Sections:
      - **Approaches**: 2-3 approaches with trade-offs and a recommendation.
      - **Decision**: The chosen approach and who accepted it (the ledger row of the design gate).
      - **Contracts**: Cover every contract id from design.md (hand-off). For each one: how the
        decision meets it, or why it cannot be met. A contract without a line here blocks plan.
      - **Constraints**: The team rules from the envgene-code-review skill, one line each.
      - **Out of scope**: What is deliberately not done.
      - **Open Questions**: Only items that do not change the specs, the approach or the tasks.
        If an open question would change them, resolve it with the developer first.

      If the decision changes scope or the set of tasks, say so: the change returns to the propose gate.
    requires:
      - specs
      - handoff-design

apply:
  requires: [tasks, dev-design]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
