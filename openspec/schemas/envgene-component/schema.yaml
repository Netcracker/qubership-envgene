name: envgene-component
version: 1
description: EnvGene component flow - proposal → specs → tasks (propose gate) → dev-design → implement; hand-off design.md is an input, not an artifact
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this change is needed and WHAT it covers, rendered from the
      exploration brief's Problem and Why and the decided scope.

      Sections:
      - **Why**: one or two sentences on the problem and why now.
      - **What Changes**: the implementation slice as a work-map. Group items by the component or pipeline
        step they touch, each item atomic to one change, naming only the documented surface a reader can look
        up in the docs, never code internals (no file paths, no private function names). Mark a breaking change
        with **BREAKING**.
      - **Capabilities**: New Capabilities (each becomes specs/<capability-path>/spec.md, named for a durable
        behavior not the work in this change, kebab-case) and Modified Capabilities (exact existing paths
        under openspec/specs/, left empty if no requirement changes).
      - **Impact**: affected objects, parameters, pipeline steps, and docs.

      Keep it to one or two pages. References point to the change's own siblings - the delta specs under
      specs/ and the ADR under docs/adr/ - not to an external design doc. Acceptance conditions do NOT go
      here, they live in the specs as scenarios. Honor the writing-docs house style and the analyst voice.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create the delta spec files that define WHAT the system must do, one per capability the proposal names,
      rendered from the exploration brief's Intended-behavior cases. Fill each per the writing-gherkin OpenSpec
      delta-spec projection:

      - Group requirements under a delta header: ## ADDED Requirements, ## MODIFIED Requirements,
        ## REMOVED Requirements, or ## RENAMED Requirements.
      - Each requirement is ### Requirement: <name> followed by one SHALL statement naming the behavior.
      - Each scenario is #### Scenario: <name> with a - **WHEN** line (trigger and discriminating fixture) and
        a - **THEN** line (observable outcome on the grounded channel). Use exactly four hashtags for Scenario.
      - Every requirement has at least one scenario. One scenario per independently-failing case.
      - A new capability's file opens with ## Purpose (one or two sentences, 50 or more characters). A delta to
        an existing capability has no Purpose section.

      Enumerate observable cases, one per distinct outcome, the discriminating precondition in the WHEN, every
      THEN on an observable channel. Honor the writing-gherkin grounding and the writing-docs house style.
    requires:
      - proposal

  # The hand-off design.md (contracts, order, dependencies) is an input from the JCPR workspace, not an artifact
  # generated in this change. It is deliberately not declared here: openspec puts every existing artifact of the
  # schema into the apply context, and implement must not receive it (it reads plan.md and dev-design.md).

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work for this component.

      Tasks are approved at the propose gate together with the proposal, the specs and the
      hand-off design. If the dev design later changes the scope or the set of tasks, the change
      goes back to the propose gate; a change that only refines the implementation may update
      the tasks without a new approval.

      **IMPORTANT: Follow the template below for tracked tasks.** Each tracked task MUST be a
      checkbox: `- [ ] X.Y Task description`, and states how to verify completion.

      Reference specs for what needs to be built.
    requires:
      - specs

  - id: dev-design
    generates: dev-design.md
    description: Component team's design decision for the change - approaches, the chosen one, constraints. Written after the propose gate and before plan.
    template: dev-design.md
    instruction: |
      Create the dev design: the component team's decision on HOW this change is implemented.
      It is written after the propose gate, so the owner has already approved WHAT is changed.

      Sections:
      - **Approaches**: 2-3 approaches with trade-offs and a recommendation.
      - **Decision**: The chosen approach and who accepted it (the ledger row of the design gate).
      - **Contracts**: Cover every contract id from design.md (hand-off). For each one: how the
        decision meets it, or why it cannot be met. A contract without a line here blocks plan.
      - **Constraints**: The team rules from the envgene-code-review skill, one line each.
      - **Out of scope**: What is deliberately not done.
      - **Open Questions**: Only items that do not change the specs, the approach or the tasks.
        If an open question would change them, resolve it with the developer first.

      If the decision changes scope or the set of tasks, say so: the change returns to the propose gate.
    requires:
      - specs

apply:
  requires: [tasks, dev-design]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
